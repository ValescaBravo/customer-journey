<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Journey Mapping – Interactive Circle</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style> body{font-family:'Inter',sans-serif} .chip{border-radius:9999px;padding:.25rem .6rem;cursor:pointer} .badge{border-radius:.5rem;padding:.15rem .45rem} .card{transition:transform .25s ease, box-shadow .25s ease} .card:hover{transform:translateY(-2px)} </style>
  <!-- React 18 via CDN (no build step) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-b from-blue-50 to-emerald-50 text-gray-800">
  <header class="max-w-6xl mx-auto px-6 py-10">
    <a href="https://valescabravo.github.io/" class="inline-flex items-center text-sm text-blue-700 hover:underline">← Back to Portfolio</a>
    <h1 class="text-3xl md:text-5xl font-extrabold mt-4 leading-tight">Customer Journey Mapping
      <span class="block text-xl md:text-2xl font-semibold text-gray-600">From Awareness to Advocacy (Interactive Circle)</span>
    </h1>
    <p class="mt-3 text-gray-700 max-w-3xl">Hover a stage to see a short description beside the circle. Click a stage to open the full details below.</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <span class="chip bg-indigo-100 text-indigo-800">Interactive</span>
      <span class="chip bg-emerald-100 text-emerald-800">React (CDN)</span>
      <span class="chip bg-purple-100 text-purple-800">GitHub Pages‑ready</span>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-6 pb-20"></main>

  <footer class="text-center text-sm text-gray-500 pb-10">© 2026 Valesca Bravo — Interactive Lab</footer>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Card = ({ title, children, accent = 'indigo' }) => (
      <div className={`card bg-white/90 backdrop-blur shadow rounded-2xl p-5 border-l-4 ${
        accent==='blue'?'border-blue-500':accent==='emerald'?'border-emerald-500':accent==='rose'?'border-rose-500':accent==='violet'?'border-violet-500':accent==='indigo'?'border-indigo-500':'border-amber-500'
      }`}>
        <h3 className="text-xl font-bold mb-2">{title}</h3>
        <div className="text-sm md:text-base text-gray-700">{children}</div>
      </div>
    );

    const stages = [
      { key:'awareness', label:'Awareness', color:'#60a5fa', emoji:'📣',
        def:'First contact with your brand/product.',
        behaviour:'Discover via ads, influencers, search, word‑of‑mouth.',
        channels:['TikTok','Instagram','YouTube','PR','OOH'],
        kpis:['Reach','Impressions','CPM','Engagement rate'],
        ai:['Lookalike audiences','Creative testing','Topic discovery'],
        tools:['GA4','Sprout Social','TikTok Ads','Meta Ads']
      },
      { key:'consideration', label:'Consideration', color:'#34d399', emoji:'🔍',
        def:'Evaluating and comparing options.',
        behaviour:'Reads reviews, watches demos, compares pricing/features.',
        channels:['SEO','Blogs','YouTube','Comparison sites','Email nurture'],
        kpis:['CTR','Sessions','Time on page','Bounce rate'],
        ai:['Recommenders','Dynamic content','Semantic search'],
        tools:['HubSpot','YouTube','Google Search Console','WordPress']
      },
      { key:'conversion', label:'Conversion', color:'#a78bfa', emoji:'💳',
        def:'Takes the key action (purchase/sign‑up).',
        behaviour:'Adds to cart, checks out, books a demo.',
        channels:['E‑commerce','Checkout','Chatbots','Marketplaces'],
        kpis:['CVR','AOV','ROAS','Cart abandonment'],
        ai:['Smart pricing','Fraud detection','Checkout optimisation'],
        tools:['WooCommerce','Stripe','Hotjar','Google Tag Manager']
      },
      { key:'retention', label:'Retention', color:'#fbbf24', emoji:'🔁',
        def:'Keeps customers engaged and active.',
        behaviour:'Repeat purchases, loyalty, support interactions.',
        channels:['Email','Push','Loyalty app','Customer success'],
        kpis:['Churn rate','Repeat rate','CLV','NPS'],
        ai:['Churn prediction','Send‑time optimisation','Offer personalisation'],
        tools:['Braze','Klaviyo','HubSpot','Zendesk']
      },
      { key:'advocacy', label:'Advocacy', color:'#f472b6', emoji:'📣',
        def:'Customers promote the brand.',
        behaviour:'Reviews, referrals, UGC, social shares.',
        channels:['Communities','Affiliate','Social','Forums'],
        kpis:['Referral rate','NPS','Share of voice','UGC volume'],
        ai:['Sentiment analysis','Influencer discovery','Anomaly detection'],
        tools:['Brand24','Sprout Social','Reddit','Referral tools']
      }
    ];

    function Circle({active, setActive, onHover}){
      // SVG circle with 5 arcs
      const size = 320, center = size/2, rOuter = 120, rInner = 80; // smaller donut
      const anglePer = 360 / stages.length;

      const arcPath = (startAngle, endAngle) => {
        const toXY = (angle, radius) => {
          const a = (angle-90) * Math.PI/180;
          return [center + radius*Math.cos(a), center + radius*Math.sin(a)];
        };
        const [x1,y1] = toXY(startAngle, rOuter);
        const [x2,y2] = toXY(endAngle, rOuter);
        const [x3,y3] = toXY(endAngle, rInner);
        const [x4,y4] = toXY(startAngle, rInner);
        const largeArc = (endAngle-startAngle) > 180 ? 1 : 0;
        return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x4} ${y4} Z`;
      };

      return (
        <svg width={size} height={size} className="mx-auto">
          <defs>
            <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000033"/></filter>
          </defs>
          {stages.map((s, i) => {
            const start = i*anglePer; const end = (i+1)*anglePer - 2;
            const isActive = active===s.key;
            return (
              <path key={s.key}
                d={arcPath(start, end)}
                fill={s.color}
                opacity={isActive? 0.95 : 0.55}
                filter="url(#shadow)"
                className="cursor-pointer transition-all duration-300"
                onClick={() => { setActive(s.key); onHover(null); }}
                onMouseEnter={e=> { e.currentTarget.style.opacity = isActive? 0.95 : 0.8; onHover(s); }}
                onMouseLeave={e=> { e.currentTarget.style.opacity = isActive? 0.95 : 0.55; onHover(null); }}
              />
            );
          })}
          <circle cx={center} cy={center} r={rInner-20} fill="#ffffff" stroke="#e5e7eb" />
          <text x={center} y={center-6} textAnchor="middle" className="fill-gray-800" style={{fontSize:14,fontWeight:700}}>Customer</text>
          <text x={center} y={center+12} textAnchor="middle" className="fill-gray-500" style={{fontSize:11}}>Journey</text>
          {stages.map((s,i)=>{
            const mid = i*anglePer + anglePer/2 - 90;
            const rad = (mid)*Math.PI/180; const rr = rOuter+22;
            const x = center + rr*Math.cos(rad); const y = center + rr*Math.sin(rad);
            return (
              <g key={s.key}
                 onClick={()=>{ setActive(s.key); onHover(null); }}
                 onMouseEnter={()=> onHover(s)}
                 onMouseLeave={()=> onHover(null)}
                 className="cursor-pointer">
                <circle cx={x} cy={y-6} r="9" fill={s.color} opacity="0.9" />
                <text x={x} y={y+12} textAnchor="middle" className="fill-gray-700" style={{fontSize:10,fontWeight:700}}>{s.label}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    function DetailPanel({stage}){
      if(!stage) return null;
      const pill = (t)=> <span className="inline-flex items-center px-2 py-1 text-xs bg-gray-100 rounded border border-gray-200">{t}</span>;
      return (
        <div className="grid md:grid-cols-2 gap-4">
          <Card title={`${stage.emoji} ${stage.label}: What it is`} accent="indigo">
            <p>{stage.def}</p>
            <p className="mt-2 text-gray-700">Customer behaviour: {stage.behaviour}</p>
          </Card>
          <Card title="Channels" accent="blue">
            <div className="flex flex-wrap gap-2">{stage.channels.map(pill)}</div>
          </Card>
          <Card title="KPIs" accent="emerald">
            <div className="flex flex-wrap gap-2">{stage.kpis.map(pill)}</div>
          </Card>
          <Card title="AI / Data" accent="violet">
            <div className="flex flex-wrap gap-2">{stage.ai.map(pill)}</div>
          </Card>
          <Card title="Tools (examples)" accent="amber">
            <div className="flex flex-wrap gap-2">{stage.tools.map(pill)}</div>
          </Card>
        </div>
      );
    }

    function HoverPanel({stage}){
      if(!stage) return (
        <div className="text-sm text-gray-500 border border-dashed rounded-xl p-4 bg-white/70">
          Hover a stage in the circle to preview its definition here.
        </div>
      );
      return (
        <div className="bg-white border rounded-2xl p-4 shadow-sm">
          <div className="text-xs text-gray-500 mb-1">Preview</div>
          <div className="text-base font-semibold flex items-center gap-2">
            <span style={{background:stage.color}} className="inline-block w-2 h-2 rounded-full"></span>
            {stage.emoji} {stage.label}
          </div>
          <div className="mt-2 text-sm text-gray-700">{stage.def}</div>
          <div className="mt-2 text-xs text-gray-600"><span className="font-semibold">Behaviour:</span> {stage.behaviour}</div>
        </div>
      );
    }

    function App(){
      const [active, setActive] = useState('consideration');
      const [hovered, setHovered] = useState(null);

      useEffect(()=>{
        const hash = window.location.hash.replace('#','');
        if(stages.find(s=>s.key===hash)) setActive(hash);
      },[]);

      useEffect(()=>{
        window.location.hash = active;
      },[active]);

      const current = stages.find(s=>s.key===active);

      return (
        <div className="space-y-8">
          <Card title="Journey Overview (hover for preview, click for details)" accent="violet">
            <div className="grid md:grid-cols-2 gap-6 items-center">
              <div className="flex flex-col items-center">
                <Circle active={active} setActive={setActive} onHover={setHovered} />
                <div className="mt-4 flex flex-wrap gap-2 text-xs text-gray-600">
                  {stages.map(s => (
                    <button key={s.key} className={`chip border ${active===s.key? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-indigo-700 border-indigo-200 hover:bg-indigo-100'}`} onClick={()=>{ setActive(s.key); setHovered(null); }} onMouseEnter={()=> setHovered(s)} onMouseLeave={()=> setHovered(null)}>
                      {s.emoji} {s.label}
                    </button>
                  ))}
                </div>
              </div>
              <HoverPanel stage={hovered} />
            </div>
          </Card>

          <DetailPanel stage={current} />

          <div className="text-center text-sm text-gray-600">Tip: Hover to preview beside the circle. Click a stage to open full details below.</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
  </script>
</body>
</html>
